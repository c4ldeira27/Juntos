# Local development infrastructure. The API and the front end run outside Docker (dotnet run / npm run dev)
# for hot reload and debugging; only "services" live here: the database.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: agenda-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Create the .env file from .env.example}
    # Host port 14333 so it doesn't clash with a SQL Server installed on the machine.
    ports:
      - "14333:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  sqldata:
